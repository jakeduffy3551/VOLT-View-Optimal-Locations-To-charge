<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VOLT - EV Route & Charger Finder</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <!-- Mapbox GL JS CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2d3748;
      background: #f7fafc;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
    #sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 380px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #1a202c;
    }
    .header-subtitle {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #718096;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    input[type="text"] {
      width: 100%;
      padding: 9px 32px 9px 12px;
      font-size: 13px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
    }
    input[type="text"]:focus {
      border-color: #0066FF;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
    }
    .btn-clear {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: #a0aec0;
      font-size: 16px;
      cursor: pointer;
      display: none;
      padding: 2px 4px;
      line-height: 1;
    }
    .btn-clear:hover {
      color: #4a5568;
    }
    /* Autocomplete dropdown */
    .autocomplete-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: #ffffff;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      max-height: 220px;
      overflow-y: auto;
      z-index: 50;
      display: none;
    }
    .autocomplete-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid #edf2f7;
      transition: background 0.12s ease;
    }
    .autocomplete-item:last-child {
      border-bottom: none;
    }
    .autocomplete-item:hover,
    .autocomplete-item.selected {
      background: #ebf8ff;
    }
    .item-primary {
      font-size: 13px;
      font-weight: 600;
      color: #1a202c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-secondary {
      font-size: 11px;
      color: #718096;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-plan {
      background: #0066FF;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn-plan:hover {
      background: #0052cc;
    }
    .btn-plan:active {
      transform: scale(0.99);
    }
    .btn-plan:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }
    #status-msg {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .status-loading {
      background: #ebf8ff;
      color: #2b6cb0;
      display: flex !important;
    }
    .status-error {
      background: #fff5f5;
      color: #c53030;
      display: flex !important;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #2b6cb0;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #results-card {
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .stat-label {
      font-size: 11px;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-val {
      font-size: 15px;
      font-weight: 700;
      color: #1a202c;
      margin-top: 2px;
    }
    .charger-summary {
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      border-radius: 8px;
      padding: 10px;
    }
    .charger-title {
      font-size: 13px;
      font-weight: 700;
      color: #2b6cb0;
      margin: 0 0 4px 0;
    }
    .charger-detail {
      font-size: 11px;
      color: #4a5568;
      margin: 2px 0;
      line-height: 1.3;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: white;
    }
    .badge-charger { background-color: #0066FF; }
    .directions-toggle {
      font-size: 12px;
      font-weight: 600;
      color: #0066FF;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      user-select: none;
    }
    #directions-list {
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      padding-left: 18px;
      margin: 4px 0 0 0;
      color: #4a5568;
    }
    #directions-list li {
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .leg-header {
      list-style: none;
      font-weight: 700;
      color: #2d3748;
      margin-left: -18px;
      margin-top: 8px;
      margin-bottom: 4px;
      background: #edf2f7;
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="sidebar">
  <div>
    <h1 class="header-title">VOLT Charger Finder</h1>
    <p class="header-subtitle">Find optimal EV charging stations along your route</p>
  </div>

  <form id="route-form" onsubmit="handlePlanRoute(event)">
    <div class="form-group">
      <label for="start-input">Start Location</label>
      <div class="input-wrapper">
        <input type="text" id="start-input" placeholder="Address, business, landmark, or coordinates" value="" autocomplete="off" required />
        <button type="button" class="btn-clear" id="start-clear" onclick="clearInput('start-input')" title="Clear">&times;</button>
      </div>
      <div class="autocomplete-dropdown" id="start-dropdown"></div>
    </div>

    <div class="form-group" style="margin-top: 8px;">
      <label for="end-input">Destination</label>
      <div class="input-wrapper">
        <input type="text" id="end-input" placeholder="Address, business, landmark, or coordinates" value="" autocomplete="off" required />
        <button type="button" class="btn-clear" id="end-clear" onclick="clearInput('end-input')" title="Clear">&times;</button>
      </div>
      <div class="autocomplete-dropdown" id="end-dropdown"></div>
    </div>

    <button type="submit" id="submit-btn" class="btn-plan" style="margin-top: 12px; width: 100%;">
      <span>Find Route &amp; Optimal Charger</span>
    </button>
  </form>

  <div id="status-msg">
    <div class="spinner"></div>
    <span id="status-text">Planning route...</span>
  </div>

  <div id="results-card">
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Total Distance</div>
        <div class="stat-val" id="res-distance">-- mi</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Drive Time</div>
        <div class="stat-val" id="res-time">-- min</div>
      </div>
    </div>

    <div class="charger-summary">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span class="badge badge-charger">OPTIMAL CHARGER STOP</span>
        <span id="res-charger-kw" style="font-size:11px; font-weight:700; color:#2b6cb0;"></span>
      </div>
      <h4 class="charger-title" id="res-charger-title">Charging Station</h4>
      <div class="charger-detail"><b>Address:</b> <span id="res-charger-addr">--</span></div>
      <div class="charger-detail"><b>Operator:</b> <span id="res-charger-op">--</span></div>
      <div class="charger-detail"><b>Plug:</b> <span id="res-charger-plug">--</span></div>
    </div>

    <div>
      <div class="directions-toggle" onclick="toggleDirections()">
        <span>Driving Directions</span>
        <span id="toggle-arrow">[hide]</span>
      </div>
      <ol id="directions-list"></ol>
    </div>
  </div>
</div>

<!-- Mapbox GL JS -->
<script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
<script>
  const accessToken = 'pk.eyJ1IjoibWFkZG94bCIsImEiOiJjbXU3OG1vbWgwanBwMnpwdDVwaGtndTRqIn0.xreTdZS3Gu9ThwR2brfAFw';
  mapboxgl.accessToken = accessToken;

  let startMarker = null;
  let endMarker = null;
  let chargerMarker = null;
  let showDirections = true;

  // Cache resolved coordinates when selected from autocomplete: { lat, lon, name }
  const resolvedCoordsCache = {
    start: null,
    end: null
  };

  // Initialize Mapbox
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12',
    center: [-71.225, 42.208],
    zoom: 12
  });

  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  function toggleDirections() {
    showDirections = !showDirections;
    document.getElementById('directions-list').style.display = showDirections ? 'block' : 'none';
    document.getElementById('toggle-arrow').textContent = showDirections ? '[hide]' : '[show]';
  }

  function setStatus(msg, isError = false) {
    const statusBox = document.getElementById('status-msg');
    const statusText = document.getElementById('status-text');
    const spinner = statusBox.querySelector('.spinner');

    if (!msg) {
      statusBox.style.display = 'none';
      return;
    }
    statusBox.style.display = 'flex';
    statusBox.className = isError ? 'status-error' : 'status-loading';
    spinner.style.display = isError ? 'none' : 'block';
    statusText.textContent = msg;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function clearInput(inputId) {
    const input = document.getElementById(inputId);
    input.value = '';
    const key = inputId === 'start-input' ? 'start' : 'end';
    resolvedCoordsCache[key] = null;
    const clearBtn = document.getElementById(key + '-clear');
    if (clearBtn) clearBtn.style.display = 'none';
    const dropdown = document.getElementById(key + '-dropdown');
    if (dropdown) dropdown.style.display = 'none';
    input.focus();
  }

  // Parse raw coordinate input e.g. "42.2033, -71.2185"
  function parseCoordinates(query) {
    if (!query) return null;
    const match = query.trim().match(/^([-+]?\d+(?:\.\d+)?)[,\s]+([-+]?\d+(?:\.\d+)?)$/);
    if (match) {
      const lat = parseFloat(match[1]);
      const lon = parseFloat(match[2]);
      if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
        return { name: `${lat.toFixed(4)}, ${lon.toFixed(4)}`, lat, lon };
      }
    }
    return null;
  }

  // =========================================================================
  // SMART ADDRESS AUTOCOMPLETE & SUGGESTIONS
  // =========================================================================

  function setupAutocomplete(inputId, dropdownId, cacheKey) {
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    const clearBtn = document.getElementById(cacheKey + '-clear');
    let debounceTimer = null;
    let currentSuggestions = [];

    input.addEventListener('input', () => {
      const query = input.value.trim();
      clearBtn.style.display = query.length > 0 ? 'block' : 'none';
      resolvedCoordsCache[cacheKey] = null; // user is typing, reset cached pick

      clearTimeout(debounceTimer);
      if (query.length < 2) {
        dropdown.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(() => {
        fetchAddressSuggestions(query, dropdown, input, cacheKey, (sugs) => {
          currentSuggestions = sugs;
        });
      }, 200);
    });

    input.addEventListener('focus', () => {
      if (currentSuggestions.length > 0 && input.value.trim().length >= 2) {
        dropdown.style.display = 'block';
      }
    });

    // Close on click outside
    document.addEventListener('click', (e) => {
      if (!input.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });

    // Keyboard navigation (ArrowDown, ArrowUp, Enter, Escape)
    input.addEventListener('keydown', (e) => {
      const items = dropdown.querySelectorAll('.autocomplete-item');
      if (!items || items.length === 0 || dropdown.style.display === 'none') return;

      let selectedIndex = -1;
      items.forEach((item, index) => {
        if (item.classList.contains('selected')) selectedIndex = index;
      });

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (selectedIndex >= 0) items[selectedIndex].classList.remove('selected');
        const nextIndex = (selectedIndex + 1) % items.length;
        items[nextIndex].classList.add('selected');
        items[nextIndex].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (selectedIndex >= 0) items[selectedIndex].classList.remove('selected');
        const prevIndex = (selectedIndex - 1 + items.length) % items.length;
        items[prevIndex].classList.add('selected');
        items[prevIndex].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        if (selectedIndex >= 0) {
          e.preventDefault();
          items[selectedIndex].click();
        }
      } else if (e.key === 'Escape') {
        dropdown.style.display = 'none';
      }
    });
  }

  async function fetchAddressSuggestions(query, dropdown, input, cacheKey, onDone) {
    const suggestions = [];
    const seenNames = new Set();
    const mapCenter = map.getCenter();

    // 1. Query Mapbox Geocoding
    try {
      const mbUrl = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${accessToken}&autocomplete=true&proximity=${mapCenter.lng},${mapCenter.lat}&limit=5`;
      const mbRes = await fetch(mbUrl);
      if (mbRes.ok) {
        const mbData = await mbRes.json();
        if (mbData.features) {
          mbData.features.forEach(feat => {
            const primary = feat.text || feat.place_name;
            const full = feat.place_name || primary;
            let secondary = '';
            if (feat.context && feat.context.length > 0) {
              secondary = feat.context.map(c => c.text).join(', ');
            } else if (full !== primary) {
              secondary = full.replace(primary + ', ', '');
            }

            if (!seenNames.has(full.toLowerCase())) {
              seenNames.add(full.toLowerCase());
              suggestions.push({
                primary,
                secondary,
                full,
                lon: feat.center[0],
                lat: feat.center[1]
              });
            }
          });
        }
      }
    } catch (e) {
      console.warn('Mapbox suggestion fetch error:', e);
    }

    // 2. Query Nominatim for schools, landmarks, POIs, businesses
    try {
      const nomUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=4`;
      const nomRes = await fetch(nomUrl, { headers: { 'Accept': 'application/json' } });
      if (nomRes.ok) {
        const nomData = await nomRes.json();
        if (nomData) {
          nomData.forEach(item => {
            const parts = item.display_name.split(', ');
            const primary = item.name || parts[0];
            const secondary = parts.slice(1, 4).join(', ');
            const full = item.display_name;

            if (!seenNames.has(full.toLowerCase())) {
              seenNames.add(full.toLowerCase());
              suggestions.push({
                primary,
                secondary,
                full,
                lon: parseFloat(item.lon),
                lat: parseFloat(item.lat)
              });
            }
          });
        }
      }
    } catch (e) {
      console.warn('Nominatim suggestion fetch error:', e);
    }

    if (onDone) onDone(suggestions);
    renderSuggestions(suggestions, dropdown, input, cacheKey);
  }

  function renderSuggestions(suggestions, dropdown, input, cacheKey) {
    if (!suggestions || suggestions.length === 0) {
      dropdown.style.display = 'none';
      dropdown.innerHTML = '';
      return;
    }

    let html = '';
    suggestions.slice(0, 6).forEach((sug, idx) => {
      html += `
        <div class="autocomplete-item" data-idx="${idx}">
          <div class="item-primary">${escapeHtml(sug.primary)}</div>
          ${sug.secondary ? `<div class="item-secondary">${escapeHtml(sug.secondary)}</div>` : ''}
        </div>
      `;
    });

    dropdown.innerHTML = html;
    dropdown.style.display = 'block';

    const items = dropdown.querySelectorAll('.autocomplete-item');
    items.forEach((item, idx) => {
      const selectAction = (e) => {
        if (e) e.preventDefault();
        const selected = suggestions[idx];
        input.value = selected.full;
        resolvedCoordsCache[cacheKey] = {
          name: selected.full,
          lat: selected.lat,
          lon: selected.lon
        };
        dropdown.style.display = 'none';
        const clearBtn = document.getElementById(cacheKey + '-clear');
        if (clearBtn) clearBtn.style.display = 'block';
      };

      item.addEventListener('mousedown', selectAction);
      item.addEventListener('click', selectAction);
    });
  }

  // =========================================================================
  // SMART RESOLVER / INTERPRETER (Fallbacks, Typos, Zip codes, Reverse order)
  // =========================================================================

  async function resolveAddressSmart(query, cacheKey) {
    // 1. Check if user already picked from autocomplete
    if (resolvedCoordsCache[cacheKey]) {
      return resolvedCoordsCache[cacheKey];
    }

    if (!query) return null;
    const cleanQuery = query.trim();

    // 2. Direct GPS Coordinates
    const rawCoords = parseCoordinates(cleanQuery);
    if (rawCoords) return rawCoords;

    const mapCenter = map.getCenter();

    // 3. Nominatim primary query (excellent for schools, landmarks, businesses)
    try {
      const nomUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cleanQuery)}&format=json&limit=1`;
      const nomRes = await fetch(nomUrl, { headers: { 'Accept': 'application/json' } });
      if (nomRes.ok) {
        const data = await nomRes.json();
        if (data && data.length > 0) {
          return {
            name: data[0].display_name,
            lat: parseFloat(data[0].lat),
            lon: parseFloat(data[0].lon)
          };
        }
      }
    } catch (ignored) {}

    // 4. Mapbox Places with proximity
    try {
      const mbUrl = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(cleanQuery)}.json?access_token=${accessToken}&proximity=${mapCenter.lng},${mapCenter.lat}&limit=1`;
      const mbRes = await fetch(mbUrl);
      if (mbRes.ok) {
        const data = await mbRes.json();
        if (data.features && data.features.length > 0) {
          const feat = data.features[0];
          return {
            name: feat.place_name || cleanQuery,
            lon: feat.center[0],
            lat: feat.center[1]
          };
        }
      }
    } catch (ignored) {}

    // 5. If 5-digit US ZIP Code
    if (/^\d{5}(-\d{4})?$/.test(cleanQuery)) {
      try {
        const zipUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cleanQuery + ', USA')}&format=json&limit=1`;
        const zipRes = await fetch(zipUrl, { headers: { 'Accept': 'application/json' } });
        if (zipRes.ok) {
          const data = await zipRes.json();
          if (data && data.length > 0) {
            return {
              name: data[0].display_name,
              lat: parseFloat(data[0].lat),
              lon: parseFloat(data[0].lon)
            };
          }
        }
      } catch (ignored) {}
    }

    // 6. Reverse Comma Reversal (e.g. "Westwood, Dunkin" -> "Dunkin, Westwood")
    if (cleanQuery.includes(',')) {
      const reversed = cleanQuery.split(',').map(s => s.trim()).reverse().join(', ');
      try {
        const revUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(reversed)}&format=json&limit=1`;
        const revRes = await fetch(revUrl, { headers: { 'Accept': 'application/json' } });
        if (revRes.ok) {
          const data = await revRes.json();
          if (data && data.length > 0) {
            return {
              name: data[0].display_name,
              lat: parseFloat(data[0].lat),
              lon: parseFloat(data[0].lon)
            };
          }
        }
      } catch (ignored) {}
    }

    // 7. Strip leading street numbers
    const withoutNum = cleanQuery.replace(/^\d+\s+/, '');
    if (withoutNum !== cleanQuery && withoutNum.length >= 3) {
      try {
        const numUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(withoutNum)}&format=json&limit=1`;
        const numRes = await fetch(numUrl, { headers: { 'Accept': 'application/json' } });
        if (numRes.ok) {
          const data = await numRes.json();
          if (data && data.length > 0) {
            return {
              name: data[0].display_name,
              lat: parseFloat(data[0].lat),
              lon: parseFloat(data[0].lon)
            };
          }
        }
      } catch (ignored) {}
    }

    return null;
  }

  // Searches Open Charge Map API for closest EV charger to coordinates
  async function findChargerNear(lat, lon) {
    try {
      const url = `https://api.openchargemap.org/v3/poi/?latitude=${lat}&longitude=${lon}&maxresults=5&distanceunit=Miles`;
      const res = await fetch(url);
      if (res.ok) {
        const list = await res.json();
        if (list && list.length > 0) {
          const item = list[0];
          const addr = item.AddressInfo || {};
          const op = item.OperatorInfo || {};
          const conns = item.Connections || [];
          const conn = conns[0] || {};

          let addrParts = [];
          if (addr.AddressLine1) addrParts.push(addr.AddressLine1);
          if (addr.Town) addrParts.push(addr.Town);
          if (addr.StateOrProvince) addrParts.push(addr.StateOrProvince);
          if (addr.Postcode) addrParts.push(addr.Postcode);

          return {
            title: addr.Title || 'EV Charging Station',
            address: addrParts.length > 0 ? addrParts.join(', ') : 'Address Available on Route',
            operator: op.Title || 'Public Network',
            connType: conn.ConnectionType?.Title || conn.Title || 'Standard EV Plug',
            powerKw: conn.PowerKW ? `${conn.PowerKW}` : 'N/A',
            lat: addr.Latitude || lat,
            lon: addr.Longitude || lon,
            distance: addr.Distance ? addr.Distance.toFixed(1) : null
          };
        }
      }
    } catch (e) {
      console.warn('Open Charge Map API request error:', e);
    }
    return null;
  }

  async function handlePlanRoute(e) {
    if (e) e.preventDefault();
    const startVal = document.getElementById('start-input').value.trim();
    const endVal = document.getElementById('end-input').value.trim();
    if (!startVal || !endVal) return;
    await planRoute(startVal, endVal);
  }

  async function planRoute(startQuery, endQuery) {
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    document.getElementById('results-card').style.display = 'none';

    // Hide any open autocomplete dropdowns
    document.getElementById('start-dropdown').style.display = 'none';
    document.getElementById('end-dropdown').style.display = 'none';

    try {
      // 1. Geocode Start
      setStatus(`Interpreting Start Location: "${startQuery}"...`);
      const startLoc = await resolveAddressSmart(startQuery, 'start');
      if (!startLoc) {
        setStatus(`Could not find "${startQuery}". Try selecting an address from the suggestions or checking spelling.`, true);
        submitBtn.disabled = false;
        return;
      }

      // 2. Geocode Destination
      setStatus(`Interpreting Destination: "${endQuery}"...`);
      const endLoc = await resolveAddressSmart(endQuery, 'end');
      if (!endLoc) {
        setStatus(`Could not find "${endQuery}". Try selecting an address from the suggestions or checking spelling.`, true);
        submitBtn.disabled = false;
        return;
      }

      // 3. Find EV Charger near route midpoint
      const midLat = (startLoc.lat + endLoc.lat) / 2.0;
      const midLon = (startLoc.lon + endLoc.lon) / 2.0;
      setStatus('Searching Open Charge Map for optimal EV chargers...');

      let charger = await findChargerNear(midLat, midLon);
      if (!charger) {
        charger = await findChargerNear(startLoc.lat, startLoc.lon);
      }
      if (!charger) {
        charger = {
          title: 'Route Midpoint Waypoint Charger',
          address: `${midLat.toFixed(4)}, ${midLon.toFixed(4)}`,
          operator: 'Public EV Network',
          connType: 'Standard J1772 / CCS',
          powerKw: '50',
          lat: midLat,
          lon: midLon,
          distance: null
        };
      }

      // 4. Update Map Markers
      const origin = [startLoc.lon, startLoc.lat];
      const destination = [endLoc.lon, endLoc.lat];
      const chargerPoint = [charger.lon, charger.lat];

      if (startMarker) startMarker.remove();
      if (endMarker) endMarker.remove();
      if (chargerMarker) chargerMarker.remove();

      // Start Marker (Green)
      startMarker = new mapboxgl.Marker({ color: '#00704A' })
        .setLngLat(origin)
        .setPopup(new mapboxgl.Popup().setHTML(`<b>Start:</b> ${escapeHtml(startLoc.name)}`))
        .addTo(map);

      // Charger Marker (Blue)
      const chargerPopupHtml = `
        <div style="font-family: sans-serif; max-width:230px;">
          <h4 style="margin:0 0 4px 0; color:#0066FF;">${escapeHtml(charger.title)}</h4>
          <p style="margin:2px 0; font-size:12px;"><b>Address:</b> ${escapeHtml(charger.address)}</p>
          <p style="margin:2px 0; font-size:12px;"><b>Operator:</b> ${escapeHtml(charger.operator)}</p>
          <p style="margin:2px 0; font-size:12px;"><b>Plug:</b> ${escapeHtml(charger.connType)} (${escapeHtml(charger.powerKw)} kW)</p>
          ${charger.distance ? `<p style="margin:2px 0; font-size:11px; color:#666;">~${charger.distance} mi from midpoint</p>` : ''}
        </div>
      `;
      chargerMarker = new mapboxgl.Marker({ color: '#0066FF' })
        .setLngLat(chargerPoint)
        .setPopup(new mapboxgl.Popup().setHTML(chargerPopupHtml))
        .addTo(map);

      // Destination Marker (Orange)
      endMarker = new mapboxgl.Marker({ color: '#FF6600' })
        .setLngLat(destination)
        .setPopup(new mapboxgl.Popup().setHTML(`<b>Destination:</b> ${escapeHtml(endLoc.name)}`))
        .addTo(map);

      // Fit map bounds
      const bounds = new mapboxgl.LngLatBounds();
      bounds.extend(origin);
      bounds.extend(chargerPoint);
      bounds.extend(destination);
      map.fitBounds(bounds, { padding: 80, maxZoom: 15 });

      // 5. Fetch Driving Directions via Mapbox Directions API
      setStatus('Calculating route and driving directions...');
      const directionsUrl = `https://api.mapbox.com/directions/v5/mapbox/driving/${origin[0]},${origin[1]};${chargerPoint[0]},${chargerPoint[1]};${destination[0]},${destination[1]}?steps=true&geometries=geojson&overview=full&access_token=${accessToken}`;

      const dirRes = await fetch(directionsUrl);
      if (!dirRes.ok) throw new Error('Could not compute driving route');
      const dirData = await dirRes.json();

      if (dirData.routes && dirData.routes.length > 0) {
        const route = dirData.routes[0];

        // Draw Route Polyline
        if (map.getSource('route')) {
          map.getSource('route').setData({
            type: 'Feature',
            geometry: route.geometry
          });
        } else {
          map.addSource('route', {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: route.geometry
            }
          });

          map.addLayer({
            id: 'route',
            type: 'line',
            source: 'route',
            layout: {
              'line-join': 'round',
              'line-cap': 'round'
            },
            paint: {
              'line-color': '#0066FF',
              'line-width': 5,
              'line-opacity': 0.85
            }
          });
        }

        // Render Summary & Driving Directions in HTML UI
        const durationMins = Math.round(route.duration / 60);
        const distanceMiles = (route.distance / 1609.34).toFixed(1);

        document.getElementById('res-distance').textContent = `${distanceMiles} mi`;
        document.getElementById('res-time').textContent = `~${durationMins} min`;
        document.getElementById('res-charger-title').textContent = charger.title;
        document.getElementById('res-charger-addr').textContent = charger.address;
        document.getElementById('res-charger-op').textContent = charger.operator;
        document.getElementById('res-charger-plug').textContent = charger.connType;
        document.getElementById('res-charger-kw').textContent = charger.powerKw !== 'N/A' ? `${charger.powerKw} kW` : '';

        let stepsHtml = '';
        route.legs.forEach((leg, legIdx) => {
          const legLabel = legIdx === 0 ? "Leg 1: Start to Charger Stop" : "Leg 2: Charger Stop to Destination";
          stepsHtml += `<li class="leg-header">${legLabel}</li>`;
          leg.steps.forEach(step => {
            stepsHtml += `<li>${step.maneuver.instruction}</li>`;
          });
        });

        document.getElementById('directions-list').innerHTML = stepsHtml;
        document.getElementById('results-card').style.display = 'flex';
        setStatus('');
      }
    } catch (err) {
      console.error(err);
      setStatus('An error occurred while calculating the route. Please try again.', true);
    } finally {
      submitBtn.disabled = false;
    }
  }

  // Initialize Autocomplete listeners
  setupAutocomplete('start-input', 'start-dropdown', 'start');
  setupAutocomplete('end-input', 'end-dropdown', 'end');
</script>
