<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VOLT - EV Route & Charger Finder</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <!-- Mapbox GL JS CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2d3748;
      background: #f7fafc;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
    #sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 360px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #1a202c;
    }
    .header-subtitle {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #718096;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
    }
    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      font-size: 13px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="text"]:focus {
      border-color: #0066FF;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
    }
    .btn-plan {
      background: #0066FF;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn-plan:hover {
      background: #0052cc;
    }
    .btn-plan:active {
      transform: scale(0.99);
    }
    .btn-plan:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }
    #status-msg {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .status-loading {
      background: #ebf8ff;
      color: #2b6cb0;
      display: flex !important;
    }
    .status-error {
      background: #fff5f5;
      color: #c53030;
      display: flex !important;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #2b6cb0;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #results-card {
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .stat-label {
      font-size: 11px;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-val {
      font-size: 15px;
      font-weight: 700;
      color: #1a202c;
      margin-top: 2px;
    }
    .charger-summary {
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      border-radius: 8px;
      padding: 10px;
    }
    .charger-title {
      font-size: 13px;
      font-weight: 700;
      color: #2b6cb0;
      margin: 0 0 4px 0;
    }
    .charger-detail {
      font-size: 11px;
      color: #4a5568;
      margin: 2px 0;
      line-height: 1.3;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: white;
    }
    .badge-charger { background-color: #0066FF; }
    .directions-toggle {
      font-size: 12px;
      font-weight: 600;
      color: #0066FF;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      user-select: none;
    }
    #directions-list {
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      padding-left: 18px;
      margin: 4px 0 0 0;
      color: #4a5568;
    }
    #directions-list li {
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .leg-header {
      list-style: none;
      font-weight: 700;
      color: #2d3748;
      margin-left: -18px;
      margin-top: 8px;
      margin-bottom: 4px;
      background: #edf2f7;
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="sidebar">
  <div>
    <h1 class="header-title">VOLT Charger Finder</h1>
    <p class="header-subtitle">Find optimal EV charging stations along your route</p>
  </div>

  <form id="route-form" onsubmit="handlePlanRoute(event)">
    <div class="form-group">
      <label for="start-input">Start Location</label>
      <input type="text" id="start-input" placeholder="Enter starting address, city, or coordinates" value="" required />
    </div>

    <div class="form-group" style="margin-top: 8px;">
      <label for="end-input">Destination</label>
      <input type="text" id="end-input" placeholder="Enter destination address, city, or coordinates" value="" required />
    </div>

    <button type="submit" id="submit-btn" class="btn-plan" style="margin-top: 12px; width: 100%;">
      <span>Find Route &amp; Optimal Charger</span>
    </button>
  </form>

  <div id="status-msg">
    <div class="spinner"></div>
    <span id="status-text">Planning route...</span>
  </div>

  <div id="results-card">
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Total Distance</div>
        <div class="stat-val" id="res-distance">-- mi</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Drive Time</div>
        <div class="stat-val" id="res-time">-- min</div>
      </div>
    </div>

    <div class="charger-summary">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span class="badge badge-charger">OPTIMAL CHARGER STOP</span>
        <span id="res-charger-kw" style="font-size:11px; font-weight:700; color:#2b6cb0;"></span>
      </div>
      <h4 class="charger-title" id="res-charger-title">Charging Station</h4>
      <div class="charger-detail"><b>Address:</b> <span id="res-charger-addr">--</span></div>
      <div class="charger-detail"><b>Operator:</b> <span id="res-charger-op">--</span></div>
      <div class="charger-detail"><b>Plug:</b> <span id="res-charger-plug">--</span></div>
    </div>

    <div>
      <div class="directions-toggle" onclick="toggleDirections()">
        <span>Driving Directions</span>
        <span id="toggle-arrow">[hide]</span>
      </div>
      <ol id="directions-list"></ol>
    </div>
  </div>
</div>

<!-- Mapbox GL JS -->
<script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
<script>
  const accessToken = 'pk.eyJ1IjoibWFkZG94bCIsImEiOiJjbXU3OG1vbWgwanBwMnpwdDVwaGtndTRqIn0.xreTdZS3Gu9ThwR2brfAFw';
  mapboxgl.accessToken = accessToken;

  let startMarker = null;
  let endMarker = null;
  let chargerMarker = null;
  let showDirections = true;

  // Initialize Mapbox
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12',
    center: [-71.225, 42.208],
    zoom: 12
  });

  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  function toggleDirections() {
    showDirections = !showDirections;
    document.getElementById('directions-list').style.display = showDirections ? 'block' : 'none';
    document.getElementById('toggle-arrow').textContent = showDirections ? '[hide]' : '[show]';
  }

  function setStatus(msg, isError = false) {
    const statusBox = document.getElementById('status-msg');
    const statusText = document.getElementById('status-text');
    const spinner = statusBox.querySelector('.spinner');

    if (!msg) {
      statusBox.style.display = 'none';
      return;
    }
    statusBox.style.display = 'flex';
    statusBox.className = isError ? 'status-error' : 'status-loading';
    spinner.style.display = isError ? 'none' : 'block';
    statusText.textContent = msg;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Parse raw coordinate input e.g. "42.2033, -71.2185"
  function parseCoordinates(query) {
    if (!query) return null;
    const match = query.trim().match(/^([-+]?\d+(?:\.\d+)?)[,\s]+([-+]?\d+(?:\.\d+)?)$/);
    if (match) {
      const lat = parseFloat(match[1]);
      const lon = parseFloat(match[2]);
      if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
        return { name: `${lat.toFixed(4)}, ${lon.toFixed(4)}`, lat, lon };
      }
    }
    return null;
  }

  // Geocodes location using Mapbox Geocoding API with Nominatim fallback
  async function geocodeLocation(query) {
    const rawCoords = parseCoordinates(query);
    if (rawCoords) return rawCoords;

    // 1. Try Mapbox Geocoding API
    try {
      const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${accessToken}&limit=1`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (data.features && data.features.length > 0) {
          const feat = data.features[0];
          return {
            name: feat.place_name || query,
            lon: feat.center[0],
            lat: feat.center[1]
          };
        }
      }
    } catch (e) {
      console.warn('Mapbox geocoding error:', e);
    }

    // 2. Fallback to Nominatim
    try {
      const nomUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`;
      const nomRes = await fetch(nomUrl, { headers: { 'Accept': 'application/json' } });
      if (nomRes.ok) {
        const nomData = await nomRes.json();
        if (nomData && nomData.length > 0) {
          return {
            name: nomData[0].display_name || query,
            lat: parseFloat(nomData[0].lat),
            lon: parseFloat(nomData[0].lon)
          };
        }
      }
    } catch (e) {
      console.warn('Nominatim geocoding error:', e);
    }

    return null;
  }

  // Searches Open Charge Map API for closest EV charger to coordinates
  async function findChargerNear(lat, lon) {
    try {
      const url = `https://api.openchargemap.org/v3/poi/?latitude=${lat}&longitude=${lon}&maxresults=5&distanceunit=Miles`;
      const res = await fetch(url);
      if (res.ok) {
        const list = await res.json();
        if (list && list.length > 0) {
          const item = list[0];
          const addr = item.AddressInfo || {};
          const op = item.OperatorInfo || {};
          const conns = item.Connections || [];
          const conn = conns[0] || {};

          let addrParts = [];
          if (addr.AddressLine1) addrParts.push(addr.AddressLine1);
          if (addr.Town) addrParts.push(addr.Town);
          if (addr.StateOrProvince) addrParts.push(addr.StateOrProvince);
          if (addr.Postcode) addrParts.push(addr.Postcode);

          return {
            title: addr.Title || 'EV Charging Station',
            address: addrParts.length > 0 ? addrParts.join(', ') : 'Address Available on Route',
            operator: op.Title || 'Public Network',
            connType: conn.ConnectionType?.Title || conn.Title || 'Standard EV Plug',
            powerKw: conn.PowerKW ? `${conn.PowerKW}` : 'N/A',
            lat: addr.Latitude || lat,
            lon: addr.Longitude || lon,
            distance: addr.Distance ? addr.Distance.toFixed(1) : null
          };
        }
      }
    } catch (e) {
      console.warn('Open Charge Map API request error:', e);
    }
    return null;
  }

  async function handlePlanRoute(e) {
    if (e) e.preventDefault();
    const startVal = document.getElementById('start-input').value.trim();
    const endVal = document.getElementById('end-input').value.trim();
    if (!startVal || !endVal) return;
    await planRoute(startVal, endVal);
  }

  async function planRoute(startQuery, endQuery) {
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    document.getElementById('results-card').style.display = 'none';

    try {
      // 1. Geocode Start
      setStatus(`Locating Start: "${startQuery}"...`);
      const startLoc = await geocodeLocation(startQuery);
      if (!startLoc) {
        setStatus(`Could not find location for "${startQuery}". Please check spelling.`, true);
        submitBtn.disabled = false;
        return;
      }

      // 2. Geocode Destination
      setStatus(`Locating Destination: "${endQuery}"...`);
      const endLoc = await geocodeLocation(endQuery);
      if (!endLoc) {
        setStatus(`Could not find location for "${endQuery}". Please check spelling.`, true);
        submitBtn.disabled = false;
        return;
      }

      // 3. Find EV Charger near route midpoint
      const midLat = (startLoc.lat + endLoc.lat) / 2.0;
      const midLon = (startLoc.lon + endLoc.lon) / 2.0;
      setStatus('Searching Open Charge Map for optimal EV chargers...');

      let charger = await findChargerNear(midLat, midLon);
      if (!charger) {
        // Fallback: search near start
        charger = await findChargerNear(startLoc.lat, startLoc.lon);
      }
      if (!charger) {
        // Fallback waypoint
        charger = {
          title: 'Route Midpoint Waypoint Charger',
          address: `${midLat.toFixed(4)}, ${midLon.toFixed(4)}`,
          operator: 'Public EV Network',
          connType: 'Standard J1772 / CCS',
          powerKw: '50',
          lat: midLat,
          lon: midLon,
          distance: null
        };
      }

      // 4. Update Map Markers
      const origin = [startLoc.lon, startLoc.lat];
      const destination = [endLoc.lon, endLoc.lat];
      const chargerPoint = [charger.lon, charger.lat];

      if (startMarker) startMarker.remove();
      if (endMarker) endMarker.remove();
      if (chargerMarker) chargerMarker.remove();

      // Start Marker (Green)
      startMarker = new mapboxgl.Marker({ color: '#00704A' })
        .setLngLat(origin)
        .setPopup(new mapboxgl.Popup().setHTML(`<b>Start:</b> ${escapeHtml(startLoc.name)}`))
        .addTo(map);

      // Charger Marker (Blue)
      const chargerPopupHtml = `
        <div style="font-family: sans-serif; max-width:230px;">
          <h4 style="margin:0 0 4px 0; color:#0066FF;">${escapeHtml(charger.title)}</h4>
          <p style="margin:2px 0; font-size:12px;"><b>Address:</b> ${escapeHtml(charger.address)}</p>
          <p style="margin:2px 0; font-size:12px;"><b>Operator:</b> ${escapeHtml(charger.operator)}</p>
          <p style="margin:2px 0; font-size:12px;"><b>Plug:</b> ${escapeHtml(charger.connType)} (${escapeHtml(charger.powerKw)} kW)</p>
          ${charger.distance ? `<p style="margin:2px 0; font-size:11px; color:#666;">~${charger.distance} mi from midpoint</p>` : ''}
        </div>
      `;
      chargerMarker = new mapboxgl.Marker({ color: '#0066FF' })
        .setLngLat(chargerPoint)
        .setPopup(new mapboxgl.Popup().setHTML(chargerPopupHtml))
        .addTo(map);

      // Destination Marker (Orange)
      endMarker = new mapboxgl.Marker({ color: '#FF6600' })
        .setLngLat(destination)
        .setPopup(new mapboxgl.Popup().setHTML(`<b>Destination:</b> ${escapeHtml(endLoc.name)}`))
        .addTo(map);

      // Fit map bounds
      const bounds = new mapboxgl.LngLatBounds();
      bounds.extend(origin);
      bounds.extend(chargerPoint);
      bounds.extend(destination);
      map.fitBounds(bounds, { padding: 80, maxZoom: 15 });

      // 5. Fetch Driving Directions via Mapbox Directions API
      setStatus('Calculating route and driving directions...');
      const directionsUrl = `https://api.mapbox.com/directions/v5/mapbox/driving/${origin[0]},${origin[1]};${chargerPoint[0]},${chargerPoint[1]};${destination[0]},${destination[1]}?steps=true&geometries=geojson&overview=full&access_token=${accessToken}`;

      const dirRes = await fetch(directionsUrl);
      if (!dirRes.ok) throw new Error('Could not compute driving route');
      const dirData = await dirRes.json();

      if (dirData.routes && dirData.routes.length > 0) {
        const route = dirData.routes[0];

        // Draw Route Polyline
        if (map.getSource('route')) {
          map.getSource('route').setData({
            type: 'Feature',
            geometry: route.geometry
          });
        } else {
          map.addSource('route', {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: route.geometry
            }
          });

          map.addLayer({
            id: 'route',
            type: 'line',
            source: 'route',
            layout: {
              'line-join': 'round',
              'line-cap': 'round'
            },
            paint: {
              'line-color': '#0066FF',
              'line-width': 5,
              'line-opacity': 0.85
            }
          });
        }

        // Render Summary & Driving Directions in HTML UI
        const durationMins = Math.round(route.duration / 60);
        const distanceMiles = (route.distance / 1609.34).toFixed(1);

        document.getElementById('res-distance').textContent = `${distanceMiles} mi`;
        document.getElementById('res-time').textContent = `~${durationMins} min`;
        document.getElementById('res-charger-title').textContent = charger.title;
        document.getElementById('res-charger-addr').textContent = charger.address;
        document.getElementById('res-charger-op').textContent = charger.operator;
        document.getElementById('res-charger-plug').textContent = charger.connType;
        document.getElementById('res-charger-kw').textContent = charger.powerKw !== 'N/A' ? `${charger.powerKw} kW` : '';

        let stepsHtml = '';
        route.legs.forEach((leg, legIdx) => {
          const legLabel = legIdx === 0 ? "Leg 1: Start to Charger Stop" : "Leg 2: Charger Stop to Destination";
          stepsHtml += `<li class="leg-header">${legLabel}</li>`;
          leg.steps.forEach(step => {
            stepsHtml += `<li>${step.maneuver.instruction}</li>`;
          });
        });

        document.getElementById('directions-list').innerHTML = stepsHtml;
        document.getElementById('results-card').style.display = 'flex';
        setStatus('');
      }
    } catch (err) {
      console.error(err);
      setStatus('An error occurred while calculating the route. Please try again.', true);
    } finally {
      submitBtn.disabled = false;
    }
  }
</script>

</body>
</html>
